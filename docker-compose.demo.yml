name: capstone_local_demo

services:
  mongodb-demo:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: capstone_demo_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_MONGO_PORT:-27018}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${DEMO_MONGO_USER:-demo_admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${DEMO_MONGO_PASSWORD:-demo_local_only_password}
      DO_NOT_TRACK: "1"
    volumes:
      - demo_mongodb_data:/data/db
      - demo_mongot_data:/data/mongot
    healthcheck:
      test: ["CMD", "runner", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - demo_net

  demo-seed:
    image: capstone-demo-gateway:local
    pull_policy: never
    container_name: capstone_demo_seed
    working_dir: /app
    depends_on:
      mongodb-demo:
        condition: service_healthy
    environment:
      APP_MODE: preset_training
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-rag_knowledge_base}
      MONGODB_TRAINING_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      HF_HOME: /cache/huggingface
    volumes:
      - demo_hf_cache:/cache/huggingface
      - ${HOST_HF_CACHE_DIR:-./logs/.hf_cache_empty}:/host_hf_cache:ro
      - ./logs:/app/logs
    command:
      - sh
      - -c
      - >
        if [ -d /host_hf_cache/hub ] && [ ! -d /cache/huggingface/hub ]; then
          cp -rn /host_hf_cache/. /cache/huggingface/ 2>/dev/null || true;
        fi &&
        /opt/venv/bin/python scripts/seed_demo.py --execute --summary-out /app/logs/demo_seed_summary.json
    networks:
      - demo_net

  gateway-demo:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: capstone-demo-gateway:local
    container_name: capstone_demo_gateway
    restart: unless-stopped
    depends_on:
      mongodb-demo:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DEMO_GATEWAY_PORT:-4001}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4000"
      APP_MODE: preset_training
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-rag_knowledge_base}
      MONGODB_TRAINING_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-capstone_demo_session}
      UPLOAD_STAGING_DIR: ${UPLOAD_STAGING_DIR:-/tmp/capstone_demo_uploads}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CHAT_BACKEND_URL: http://chat-service-demo:8100
      CHAT_BACKEND_TOKEN: ${CHAT_BACKEND_TOKEN:-demo_local_only_chat_token}
      # Unset means "reject": tenants need widget_config.allowed_origins (or set this in .env for local dev).
      WIDGET_DEFAULT_ALLOWED_ORIGINS: ${WIDGET_DEFAULT_ALLOWED_ORIGINS:-}
      HF_HOME: /cache/huggingface
    volumes:
      - demo_hf_cache:/cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'&&b.database_ready&&b.vector_index_ready?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - demo_net

  # Internal bridge from the gateway's POST /api/chat to retrieval and Ollama. Not published on the host.
  chat-service-demo:
    image: capstone-demo-gateway:local
    pull_policy: never
    container_name: capstone_demo_chat_service
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mongodb-demo:
        condition: service_healthy
      gateway-demo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      # The demo gateway runs in preset_training mode, so tenants and documents live in the training DB.
      MONGODB_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CHAT_BACKEND_TOKEN: ${CHAT_BACKEND_TOKEN:-demo_local_only_chat_token}
      HF_HOME: /cache/huggingface
    volumes:
      - demo_hf_cache:/cache/huggingface
    command: ["/opt/venv/bin/python", "scripts/run_chat_service.py", "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status == 200 else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - demo_net

  dashboard-demo:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4001}
    image: capstone-demo-dashboard:local
    container_name: capstone_demo_dashboard
    restart: unless-stopped
    depends_on:
      gateway-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_DASHBOARD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4001}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - demo_net

  ollama-demo:
    image: ollama/ollama:0.5.7
    container_name: capstone_demo_ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_OLLAMA_PORT:-11435}:11434"
    volumes:
      - demo_ollama_models:/root/.ollama
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge

volumes:
  demo_mongodb_data:
  demo_mongot_data:
  demo_hf_cache:
  demo_ollama_models:

